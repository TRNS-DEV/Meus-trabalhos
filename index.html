<h1>Sistema de Notas</h1>

id="nome"
placeholder="Insira seu nome">

id="nota1"
placeholder="Nota1">

<input type="number"
id="nota2"

id="nota3"

id="nota4"

Calcular Média

</button>

<h2 id="resultado"></h2>

<script>

function calcular(){
    let nome=document.getElementById("nome").value;

    let n1 =
   Number(document.getElementById("nota1").value);

   let n2 =
   Number(document.getElementById("nota2").value);

   let n3 =
   Number(document.getElementById("nota3").value);

   let n4=
   Number(document.getElementById("nota4").value);

   let media = (n1 + n2 + n3 + n4)/4;

   if(media >=9){
      document.getElementById("resultado").innerHTML =
`Desempenho de classificação A aprovado, Parabéns!`+" "+ media +" "+nome;
   }
   else if(media>=7){
    document.getElementById("resultado").innerHTML=
    `Desempenho de classificação B Aprovado`;+" "+ media +" "+nome;
   }
   else if(media>=5 && media<=6.9){
    document.getElementById("resultado").innerHTML=
    `Desempenho de Classificação C Recuperação, Ainda Dá para melhorar`+" "+ media +" "+nome;
   }
   else{
    document.getElementById("resultado").innerHTML=
    `Reprovado, Estude mais você consegue!`+ media + nome;

   } 


   }

   /* MELHORIAS:

   1. Mostrar média

   */



</script>
