<!DOCTYPE html>
<html>

<head>

    <style>
        body {

            font-family: Arial;
            text-align: center;
            background: #dbeafe;
            padding: 30px;

        }

        main {

            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;

        }

        input,
        button {

            width: 90%;
            padding: 10px;
            margin: 5px;

        }

        button {

            background: #2563eb;
            color: white;
            border: none;

        }

        /* MELHORIA:
Trocar cores e tamanhos */
    </style>

</head>

<body>

    <main>

        <h1>Sistema de Notas</h1>
        <input type="text" id="nome" placeholder="Nome do Aluno">
        <input type="number" id="nota1" placeholder="Nota 1">

        <input type="number" id="nota2" placeholder="Nota 2">
        <input type="number" id="nota3" placeholder="Nota 3">
        <input type="number" id="nota4" placeholder="Nota 4">


        <button onclick="calcular()">

            Calcular Média

        </button>

        <h2 id="resultado"></h2>

    </main>

    <script>

        function calcular() {

            let n1 =
                Number(document.getElementById("nota1").value);

            let n2 =
                Number(document.getElementById("nota2").value);
                 //adicionamos mais notas para a media semelhante a propria escola
            let n3 =
                Number(document.getElementById("nota3").value);
            let n4 =
                Number(document.getElementById("nota4").value);

            let media = (n1 + n2 + n3 + n4) / 4;

            if (media >= 6) {

                document.getElementById("resultado").innerHTML =

                    "Aprovado com média " + media.toFixed(1);

            }
            else if (media <= 5) {

                document.getElementById("resultado").innerHTML =

                    "Recuperação com média " + media.toFixed(1);

            }

            else {

                document.getElementById("resultado").innerHTML =

                    "Reprovado com média " + media.toFixed(1);

            }

            /* MELHORIAS:
         
            1. Mostrar média
            2. Mostrar recuperação
            3. Alterar cor do resultado
            4. Inserir nome do aluno
            5. Mostrar conceito A/B/C
         
            */

        }

    </script>

</body>

</html>
