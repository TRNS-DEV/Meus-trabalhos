<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js"></script>
</head>
<body>
   <main>
    <header>
        <h1>Simulador de Notas-Novo ensino médio</h1> <!---cabeçalho do projeto-->
    </header>
    <!--Painel de trimestres-->
    <form id="formulario-notas">
        <!--Espaço para os formularios-->
        <!--bloco primerio trimestre-->
        <section class="card-trimestre">
            <h2>1ºprimerio trimestre</h2>
            <div class="campo-nota">
                <label for="t1-nota1">Avaliação Principal:</label>
                <input type="number" id="t1-nota1" min="0" max="10" step="0.1" required>
            </div>
            <div class="campo-nota">
                <label for="t1-nota2">Projetos/Trabalhos:</label>
                <input type="number" id="t2-nota2" min="0" max="10" step="0.1" required>
            </div>
            <div class="campo-nota">
                <label for="t1-nota3">Atitudenal:</label>
                <input type="number" id="t3-nota3" min="0" max="10" step="0.1" required>
            </div>
        </section>
        <!--2ºtrimenstre-->
        <section class="card-trimestre">
            <h2>2ºtrimestre</h2>
            <div class="campo-nota">
                <label for="t2-nota1">Avaliação Principal:</label>
                <input type="number" id="t2-nota1" min="0" max="10" step="0.1" required>
            </div>
            <div class="campo-nota">
                <label for="t2-nota2">Projetos/Trabalho:</label>
                <input type="number" id="t2-nota2" min="0" max="10" step="0.1" required>
            </div>
            <div class="campo-nota">
                <label for="t2-nota3">Atitudenal:</label>
                <input type="number" id="t2-nota3" min="0" max="10" step="0.1" required>
            </div>
        </section>
       <!--bloco do terceiro trimestre-->
        <section class="card-trimestre">
            <h2>3ºtrimestre</h2>   
                <div class="campo-nota">
                <label for="t3-nota1">Avaliação Principal:</label>
                <input type="number" id="t3-nota1" min="0" max="10" step="0.1" required>
            </div>
            <div class="campo-nota">
                <label for="t3-nota2">Projetos/Trabalho:</label>
                <input type="number" id="t3-nota2" min="0" max="10" step="0.1" required>
            </div>
            <div class="campo-nota">
                <label for="t3-nota3">Atitudenal:</label>
                <input type="number" id="t3-nota3" min="0" max="10" step="0.1" required>
            </div>   
        </section>
        <!--Botão que inicia o calculo de tudo o que está no formulário-->
        <button type="submit " id="btn-calcular">Verificar Situação Final</button>
        
    </form>
    <!--Espaço para o javascript exibir o resultado final de aprovado ou reprovado-->
    <section id="painel-resultado">
        <!--onde sera colocado as ilustrações e mensagems-->

    </section>
   </main> 
</body>
</html>
